<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroOps</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>AeroOps</h1>
    <p>Global aviation analytics dashboard.</p>

    <section id="technical-panel">
        <h2>Technical status</h2>
        <p>API: <span id="api-status">Checking...</span></p>
        <p>Database: <span id="database-status">Checking...</span></p>
        <p>Last check: <span id="last-check">Waiting...</span></p>
    </section>

    <section id="product-panel">
        <h2>Product overview</h2>
        <p>Total airports: <span id="airport-total">Calculating...</span></p>
    </section>

    <h2>Registered airports</h2>
    <ul id="airport-list"></ul>

    <form id="airport-form">
        <label for="ident">ICAO code</label>
        <input id="ident" name="ident" required>

        <label for="name">Airport name</label>
        <input id="name" name="name" required>

        <label for="country">Country</label>
        <input id="country" name="country" required>

        <label for="latitude">Latitude</label>
        <input id="latitude" name="latitude" type="number" step="any" required>

        <label for="longitude">Longitude</label>
        <input id="longitude" name="longitude" type="number" step="any" required>

        <button type="submit">Add airport</button>
    </form>

    <script src="app.js"></script>
</body>

</html>
