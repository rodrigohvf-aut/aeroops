services:
  api:
    build: .
    container_name: aeroops-api
    expose:
      - "8000"
    environment:
      DATABASE_PATH: /data/aeroops.db
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - aeroops_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: aeroops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aeroops-postgres
    environment:
      POSTGRES_DB: aeroops
      POSTGRES_USER: aeroops
      POSTGRES_PASSWORD: aeroops_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aeroops_data:
  postgres_data: